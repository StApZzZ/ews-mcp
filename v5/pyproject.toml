[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-mcp"
version = "4.5.0a1"
description = "EWS MCP server — a lean, safety-gated, cache-first tool surface for an executive-mailbox assistant (see DESIGN.md)"
requires-python = ">=3.11"
# Exact pins: every version is a deliberate, reviewed bump. Transitive
# dependencies are pinned in requirements.lock (used by the image and CI).
dependencies = [
    "cryptography==50.0.2",  # OAuth mode: sealing upstream credentials at rest
    "exchangelib==5.6.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",  # OAuth mode: login form parsing
    "tzdata==2026.5",  # zoneinfo source of truth: slim images/Windows ship no OS tzdb
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[project.scripts]
ewsmcp = "ewsmcp.main:main"

[tool.setuptools.packages.find]
include = ["ewsmcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: ruff 0.17 widened its default rule set; the codebase
# targets the classic pyflakes + pycodestyle-error baseline.
select = ["E4", "E7", "E9", "F"]
