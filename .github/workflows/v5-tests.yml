# v5 CI: everything BLOCKING — no continue-on-error anywhere in this file.
# Also callable from v5-publish.yml so publishing can never skip the tests.
name: v5-tests

on:
  push:
    branches: ["**"]
    paths:
      - "v5/**"
      - ".github/workflows/v5-tests.yml"
      - ".github/workflows/v5-publish.yml"
  pull_request:
    paths:
      - "v5/**"
      - ".github/workflows/v5-tests.yml"
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Exact patch releases of every supported minor (requires-python >= 3.11).
        python-version: ["3.11.17", "3.12.15", "3.13.16", "3.14.8", "3.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: v5/requirements.lock
      - name: Install
        run: |
          pip install pip==26.2.1
          pip install -c v5/requirements.lock -e "./v5[dev]"
      - name: Lint (blocking)
        run: ruff check v5
      - name: Unit + contract suites (blocking)
        working-directory: v5
        run: python -m pytest tests -q
      - name: Docs match the registry (blocking)
        working-directory: v5
        run: python scripts/dump_tool_table.py --check

  boot-smoke:
    # No-Exchange end-to-end: the real HTTP server against a dead endpoint —
    # never-exit boot, tier filtering, kill-switch, cold-gate, OpenAPI.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: v5/requirements.lock
      - name: Install
        run: |
          pip install pip==26.2.1
          pip install -c v5/requirements.lock ./v5
      - name: Boot smoke (tier=full)
        working-directory: v5
        run: python scripts/boot_smoke.py full
      - name: Boot smoke (tier=draft)
        working-directory: v5
        run: python scripts/boot_smoke.py draft
      - name: Boot smoke (cache disabled)
        working-directory: v5
        env:
          EWS_CACHE_ENABLED: "false"
        run: python scripts/boot_smoke.py full

  docker-build:
    needs: [tests, boot-smoke]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ews-mcp:ci v5
      - name: Import smoke inside the image
        run: docker run --rm ews-mcp:ci python -c "import ewsmcp.main, ewsmcp.http, ewsmcp.cache.store; print('import smoke OK')"
