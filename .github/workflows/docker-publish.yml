name: Build and Publish Docker Image

# Publishes ews-mcp container images to GHCR so users can simply
#   docker pull ghcr.io/<owner>/<repo>:<exact-version-or-sha-tag>
# without cloning + building locally.
#
# Triggers:
#   * push to main      -> tag sha-<sha> (immutable)
#   * tag v*.*.*        -> tag <full semver> (immutable)
#   No floating tags (latest, branch, major, major.minor) are published.
#   * pull_request      -> build only (no push); validates the Dockerfile
#   * workflow_dispatch -> manual rebuild

on:
  push:
    branches:
      - main
      - master
    tags:
      # v3/v4.0 lines only — v4.5.* (the v5 package) is published by
      # v5-publish.yml from v5/Dockerfile; this workflow must never
      # build the legacy tree for a v5 tag.
      - 'v3.*.*'
      - 'v4.0.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ews-mcp
            org.opencontainers.image.description=MCP server for Microsoft Exchange / Office 365
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build status
        run: |
          if [ "${{ steps.docker-build.outcome }}" == "success" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::Docker image built (PR — not pushed to GHCR)."
            else
              echo "::notice::Docker image built and pushed to GHCR. Tags: ${{ steps.meta.outputs.tags }}"
            fi
          else
            echo "::error::Docker build/push failed. If push failed for permissions, enable 'Read and write permissions' in Settings → Actions → General, or push manually with: docker login ghcr.io && docker build --push -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:<exact-tag> ."
            exit 1
          fi
